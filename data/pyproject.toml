[project]
name = "public-radio"
version = "0.1.0"
description = "Public radio station ownership data"
requires-python = ">=3.10"
dependencies = [
    "datasette>=0.65.5",
    "datasette-geojson-map",
    "datasette-json-html>=1.0.1",
    "pandas",
    "pyyaml",
]

[project.optional-dependencies]
reach = [
    "numpy>=2.2.6",
    "pyogrio>=0.13.0",
    "pyproj>=3.7.1",
    "shapely>=2.1.2",
]

[tool.uv]
package = false
