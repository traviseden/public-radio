name: Validate Station Files

on:
  pull_request:
    paths:
      - "data/stations/*.yaml"
      - "data/scripts/validate_stations.py"
      - ".github/workflows/validate-stations.yml"

jobs:
  validate:
    runs-on: ubuntu-slim
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run scripts/validate_stations.py
